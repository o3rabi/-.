<style>
/* ============================================================
   O.Arabi — الستايل
   الألوان مأخوذة من اللوجو الجديد: أسود دافي + كريمي + ذهبي هادي
   ============================================================ */
:root{
  --bg:#0a0808; --bg2:#110e0d; --bg3:#181413;
  --cream:#e9e3d6; --gold:#c8a66a; --muted:#8a837a;
  --line:rgba(233,227,214,.12); --line2:rgba(233,227,214,.22);
  --ease:cubic-bezier(.2,.8,.2,1); --ease2:cubic-bezier(.77,0,.18,1);
  --f-ar:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Cinzel','Cairo',serif;
  --f-it:'Cormorant Garamond','Cairo',serif;
  --pad:clamp(20px,5vw,80px); --nav-h:78px; --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{background:var(--bg);color:var(--cream);font-family:var(--f-ar);line-height:1.75;font-size:16px;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100svh}
body.is-loading{overflow:hidden}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--gold);color:var(--bg)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
main{position:relative;z-index:2;min-height:100svh}

/* ---------- خلفيات وتأثيرات عامة ---------- */
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.grain{position:fixed;inset:-50%;z-index:90;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.progress{position:fixed;top:0;inset-inline:0;height:2px;z-index:120;background:linear-gradient(90deg,var(--gold),var(--cream));transform-origin:100% 50%;transform:scaleX(0)}

/* ---------- المؤشر ---------- */
.cursor,.cursor-dot{position:fixed;top:0;left:0;pointer-events:none;z-index:200;opacity:0;transition:opacity .3s}
.cursor{width:44px;height:44px;margin:-22px 0 0 -22px;border:1px solid var(--cream);border-radius:50%;display:grid;place-items:center;
  font-size:11px;letter-spacing:.04em;color:var(--bg);transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background .35s,border-color .35s,opacity .3s;mix-blend-mode:normal}
.cursor-dot{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--gold)}
.cursor.on,.cursor-dot.on{opacity:1}
.cursor.hover{width:64px;height:64px;margin:-32px 0 0 -32px;border-color:var(--gold)}
.cursor.label{width:84px;height:84px;margin:-42px 0 0 -42px;background:var(--cream);border-color:var(--cream);font-weight:700}
@media (hover:none),(pointer:coarse){.cursor,.cursor-dot{display:none}}

/* ---------- Preloader ---------- */
.loader{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;transition:transform 1s var(--ease2),opacity .4s .7s}
.loader.done{transform:translateY(-100%);opacity:0;pointer-events:none}
.loader-in{display:grid;justify-items:center;gap:18px;width:min(260px,70vw)}
.loader-logo{width:130px;animation:loaderLogo 1.6s var(--ease) both}
@keyframes loaderLogo{from{opacity:0;transform:scale(.8) rotate(-6deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.loader-word{font-family:var(--f-disp);letter-spacing:.5em;font-size:14px;padding-inline-start:.5em;color:var(--cream);animation:fadeUp 1s .4s var(--ease) both}
.loader-bar{width:100%;height:1px;background:var(--line2);overflow:hidden;direction:ltr}
.loader-bar i{display:block;height:100%;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:0 50%}
.loader-num{font-family:var(--f-disp);font-size:12px;color:var(--muted);direction:ltr}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- انتقال الصفحات ---------- */
.curtain{position:fixed;inset:0;z-index:150;display:flex;pointer-events:none}
.curtain i{flex:1;background:var(--bg3);transform:scaleY(0);transform-origin:50% 100%;border-inline:1px solid rgba(200,166,106,.08)}
.curtain.in i{transform:scaleY(1);transition:transform .5s var(--ease2)}
.curtain.in i:nth-child(1){transition-delay:0s}.curtain.in i:nth-child(2){transition-delay:.05s}.curtain.in i:nth-child(3){transition-delay:.1s}.curtain.in i:nth-child(4){transition-delay:.15s}.curtain.in i:nth-child(5){transition-delay:.2s}
.curtain.out i{transform:scaleY(0);transform-origin:50% 0;transition:transform .55s var(--ease2)}
.curtain.out i:nth-child(1){transition-delay:.2s}.curtain.out i:nth-child(2){transition-delay:.15s}.curtain.out i:nth-child(3){transition-delay:.1s}.curtain.out i:nth-child(4){transition-delay:.05s}.curtain.out i:nth-child(5){transition-delay:0s}
.curtain.in{pointer-events:all}

/* ---------- الهيدر ---------- */
.nav{position:fixed;top:0;inset-inline:0;z-index:100;height:var(--nav-h);padding-inline:var(--pad);display:flex;align-items:center;justify-content:space-between;gap:20px;
  transition:background .4s,backdrop-filter .4s,height .4s var(--ease),transform .5s var(--ease)}
.nav.solid{background:rgba(10,8,8,.72);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);height:64px;border-bottom:1px solid var(--line)}
.nav.hide{transform:translateY(-100%)}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--f-disp);letter-spacing:.32em;font-size:14px;font-weight:600;direction:ltr}
.brand img{height:36px;width:auto;transition:transform .8s var(--ease)}
.brand:hover img{transform:rotate(-12deg) scale(1.08)}
.nav-links{position:relative;display:flex;gap:6px}
.nav-links a{position:relative;padding:8px 16px;font-size:14.5px;color:var(--muted);transition:color .3s;z-index:1}
.nav-links a:hover,.nav-links a.active{color:var(--cream)}
.nav-ink{position:absolute;bottom:2px;height:1px;background:var(--gold);width:0;right:0;transition:right .5s var(--ease),width .5s var(--ease);pointer-events:none}
.burger{display:none;width:44px;height:44px;position:relative;z-index:130}
.burger i{position:absolute;inset-inline:11px;height:1.5px;background:var(--cream);transition:transform .5s var(--ease),top .5s var(--ease)}
.burger i:first-child{top:18px}.burger i:last-child{top:26px}
.burger.open i:first-child{top:22px;transform:rotate(45deg)}
.burger.open i:last-child{top:22px;transform:rotate(-45deg)}

/* ---------- القائمة الكاملة ---------- */
.menu{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:100px var(--pad) 40px;clip-path:circle(0% at calc(100% - 44px) 40px);transition:clip-path .9s var(--ease2);visibility:hidden}
.menu.open{clip-path:circle(150% at calc(100% - 44px) 40px);visibility:visible}
.menu-links{display:grid;gap:2px}
.menu-links a{display:flex;align-items:baseline;gap:14px;font-size:clamp(34px,10vw,64px);font-weight:900;line-height:1.3;opacity:0;transform:translateY(30px);transition:opacity .6s var(--ease),transform .7s var(--ease),color .3s}
.menu-links a small{font-family:var(--f-disp);font-size:13px;color:var(--gold);font-weight:400;letter-spacing:.2em}
.menu-links a:hover,.menu-links a.active{color:var(--gold)}
.menu.open .menu-links a{opacity:1;transform:none}
.menu.open .menu-links a:nth-child(1){transition-delay:.25s}.menu.open .menu-links a:nth-child(2){transition-delay:.3s}.menu.open .menu-links a:nth-child(3){transition-delay:.35s}.menu.open .menu-links a:nth-child(4){transition-delay:.4s}.menu.open .menu-links a:nth-child(5){transition-delay:.45s}.menu.open .menu-links a:nth-child(6){transition-delay:.5s}.menu.open .menu-links a:nth-child(7){transition-delay:.55s}
.menu-foot{margin-top:40px;display:flex;gap:24px;color:var(--muted);font-family:var(--f-disp);letter-spacing:.2em;font-size:12px;direction:ltr}
.menu-foot a:hover{color:var(--gold)}

/* ---------- أزرار ---------- */
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:999px;border:1px solid var(--line2);font-weight:600;font-size:15px;overflow:hidden;isolation:isolate;transition:color .5s var(--ease),border-color .5s,transform .3s var(--ease)}
.btn::before{content:"";position:absolute;inset:0;background:var(--cream);transform:translateY(101%);border-radius:50% 50% 0 0;transition:transform .6s var(--ease2),border-radius .6s var(--ease2);z-index:-1}
.btn:hover{color:var(--bg);border-color:var(--cream)}
.btn:hover::before{transform:none;border-radius:0}
.btn-gold{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn-gold::before{background:var(--cream)}
.btn-sm{padding:10px 22px;font-size:14px}
.btn .arr{display:inline-block;transition:transform .4s var(--ease)}
.btn:hover .arr{transform:translateX(-6px)}
.link-u{position:relative;display:inline-block;padding-bottom:4px}
.link-u::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:currentColor;transform-origin:100% 50%;transition:transform .5s var(--ease)}
.link-u:hover::after{transform:scaleX(0);transform-origin:0 50%}

/* ---------- كشف العناصر ---------- */
[data-reveal]{opacity:0;transform:translateY(36px);transition:opacity 1s var(--ease),transform 1.1s var(--ease),clip-path 1.2s var(--ease2);transition-delay:var(--d,0s)}
[data-reveal="left"]{transform:translateX(-50px)}
[data-reveal="right"]{transform:translateX(50px)}
[data-reveal="zoom"]{transform:scale(.88)}
[data-reveal="clip"]{opacity:1;transform:none;clip-path:inset(0 0 100% 0)}
[data-reveal].in{opacity:1;transform:none}
[data-reveal="clip"].in{clip-path:inset(0 0 0 0)}
.split .w{display:inline-block;overflow:hidden;vertical-align:top;padding-block:.12em;margin-block:-.12em}
.split .w>span{display:inline-block;transform:translateY(115%) rotate(4deg);transition:transform 1s var(--ease);transition-delay:calc(var(--i)*70ms + var(--sd,0s))}
.split.in .w>span{transform:none}
.sp{display:inline-block;width:.28em}

/* ---------- عناصر عامة للصفحات ---------- */
.page{padding:calc(var(--nav-h) + clamp(30px,6vw,70px)) var(--pad) 0}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-family:var(--f-disp);font-size:12px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;direction:ltr}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--gold)}
.h1{font-size:clamp(40px,7.2vw,112px);font-weight:900;line-height:1.15;letter-spacing:-.01em}
.h2{font-size:clamp(30px,4.6vw,64px);font-weight:900;line-height:1.2}
.lead{font-size:clamp(16px,1.5vw,20px);color:var(--muted);max-width:60ch}
.it{font-family:var(--f-it);font-style:italic;font-weight:500;color:var(--gold)}
.outline{-webkit-text-stroke:1px var(--cream);color:transparent}
.sec{padding-block:clamp(60px,10vw,140px)}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:24px;margin-bottom:clamp(30px,5vw,60px)}
.sec-head .lead{margin-top:14px}
.hr{height:1px;background:var(--line);border:0}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:100svh;padding:calc(var(--nav-h) + 20px) var(--pad) 40px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:30px;overflow:hidden}
.hero-copy{position:relative;z-index:3}
.hero .eyebrow{margin-bottom:26px}
.hero h1{margin-bottom:26px}
.hero h1 .it{font-weight:500;font-size:.92em;display:block;margin-top:6px}
.hero .lead{margin-bottom:38px}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px}
.hero-art{position:relative;display:grid;place-items:center;aspect-ratio:1;max-height:78vh;justify-self:center;width:min(100%,640px);--mx:0;--my:0}
.hero-art .halo{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,rgba(200,166,106,.28),rgba(200,166,106,.06) 45%,transparent 70%);filter:blur(10px);animation:halo 6s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.15);opacity:.7}}
.hero-art .ring{position:absolute;inset:2%;width:96%;height:96%;animation:spin 60s linear infinite}
.hero-art .ring.r2{inset:12%;width:76%;height:76%;animation-duration:42s;animation-direction:reverse;opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-art .logo{position:relative;width:62%;transform:translate(calc(var(--mx)*18px),calc(var(--my)*18px));transition:transform .4s var(--ease);filter:drop-shadow(0 20px 50px rgba(0,0,0,.6))}
.hero-art .logo img{width:100%;animation:float 7s ease-in-out infinite;opacity:0;transform:scale(.85) rotate(-5deg);transition:opacity 1.4s var(--ease),transform 1.6s var(--ease)}
.hero-art.in .logo img{opacity:1;transform:none}
@keyframes float{50%{translate:0 -14px}}
.hero-art .orb{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px 3px rgba(200,166,106,.7)}
.scroll-hint{position:absolute;bottom:26px;inset-inline-start:var(--pad);display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.2em;color:var(--muted);z-index:3}
.scroll-hint i{width:1px;height:46px;background:var(--line2);position:relative;overflow:hidden}
.scroll-hint i::after{content:"";position:absolute;inset-inline:0;top:-40%;height:40%;background:var(--gold);animation:drip 2s var(--ease2) infinite}
@keyframes drip{to{top:110%}}

/* ---------- شريط متحرك ---------- */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:22px;background:rgba(17,14,13,.6);position:relative;z-index:2;direction:ltr}
.marquee-track{display:flex;width:max-content;animation:marq 38s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-track span{font-family:var(--f-disp);font-size:clamp(22px,3.4vw,44px);letter-spacing:.14em;padding-inline:26px;display:inline-flex;align-items:center;gap:52px;white-space:nowrap;color:var(--cream)}
.marquee-track span:nth-child(even){-webkit-text-stroke:1px var(--line2);color:transparent}
.marquee-track span::after{content:"✦";color:var(--gold);font-size:.5em}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- أرقام ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-block:1px solid var(--line)}
.stat{padding:clamp(28px,5vw,64px) 20px;text-align:center;border-inline-end:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{display:block;font-family:var(--f-disp);font-size:clamp(40px,7vw,96px);font-weight:600;line-height:1.1;direction:ltr;background:linear-gradient(180deg,var(--cream),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--muted);font-size:14px;letter-spacing:.08em}

/* ---------- Rail أفقي ---------- */
.rail-wrap{margin-inline:calc(var(--pad)*-1)}
.rail{display:flex;gap:18px;overflow-x:auto;padding:10px var(--pad) 30px;scroll-snap-type:x proximity;scrollbar-width:none;cursor:grab}
.rail::-webkit-scrollbar{display:none}
.rail.drag{cursor:grabbing;scroll-snap-type:none}
.rail-item{flex:0 0 clamp(220px,26vw,360px);scroll-snap-align:start}

/* ---------- كروت التصاميم ---------- */
.ph{position:relative;overflow:hidden;background:linear-gradient(110deg,var(--bg2) 30%,var(--bg3) 50%,var(--bg2) 70%);background-size:200% 100%;animation:shimmer 1.6s linear infinite;border-radius:var(--r);min-height:180px}
.ph.ok{animation:none;background:var(--bg2);min-height:0}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .9s var(--ease),transform 1.2s var(--ease)}
.ph img.ld{opacity:1;transform:none}
.ph.err::after{content:"تعذر تحميل الصورة";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
@keyframes shimmer{to{background-position:-200% 0}}
.card{position:relative;display:block;border-radius:var(--r);overflow:hidden;cursor:pointer;transform-style:preserve-3d;transition:transform .5s var(--ease),box-shadow .5s}
.card .ph{border-radius:0}
.card img{transition:transform 1.2s var(--ease),opacity .9s var(--ease)}
.card:hover img.ld{transform:scale(1.07)}
.card .cap{position:absolute;inset-inline:0;bottom:0;padding:50px 18px 16px;background:linear-gradient(0deg,rgba(10,8,8,.92),transparent);transform:translateY(40%);opacity:0;transition:transform .6s var(--ease),opacity .5s}
.card:hover .cap,.card:focus-visible .cap{transform:none;opacity:1}
.cap small{display:block;font-family:var(--f-disp);font-size:10px;letter-spacing:.18em;color:var(--gold);direction:ltr;text-align:right}
.cap b{font-size:15px;font-weight:700}
.card .num{position:absolute;top:12px;inset-inline-start:14px;font-family:var(--f-disp);font-size:11px;letter-spacing:.2em;color:var(--cream);opacity:.8;text-shadow:0 1px 8px rgba(0,0,0,.7);z-index:2}
@media (hover:none){.card .cap{transform:none;opacity:1}}

/* ---------- الأعمال ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px;position:relative}
.chip{padding:10px 22px;border-radius:999px;border:1px solid var(--line2);font-size:14px;color:var(--muted);transition:color .3s,border-color .3s,background .4s,transform .3s var(--ease)}
.chip:hover{color:var(--cream);border-color:var(--cream)}
.chip.active{background:var(--cream);color:var(--bg);border-color:var(--cream)}
.chip em{font-style:normal;font-family:var(--f-disp);font-size:11px;opacity:.6;margin-inline-start:6px}
.masonry{columns:3;column-gap:18px}
.masonry .card{break-inside:avoid;margin-bottom:18px}
.pop{animation:pop .8s var(--ease) backwards;animation-delay:calc(var(--i)*55ms)}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}

/* ---------- المجموعات ---------- */
.col-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.col-card{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;display:block;isolation:isolate;transition:transform .5s var(--ease)}
.col-card .ph{position:absolute;inset:0;border-radius:0}
.col-card::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,8,8,.95) 8%,rgba(10,8,8,.2) 55%,rgba(10,8,8,.35));z-index:1;transition:opacity .5s}
.col-card:hover .ph img.ld{transform:scale(1.1)}
.col-info{position:absolute;inset:auto 0 0;z-index:2;padding:22px;display:grid;gap:4px}
.col-info .badge{font-family:var(--f-disp);font-size:10px;letter-spacing:.25em;color:var(--gold);direction:ltr;text-align:right}
.col-info h3{font-family:var(--f-disp);font-size:clamp(22px,2.2vw,32px);letter-spacing:.06em;font-weight:600;direction:ltr;text-align:right;line-height:1.2}
.col-info p{font-size:13px;color:var(--muted)}
.col-info .go{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--cream);margin-top:8px;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s var(--ease),opacity .5s}
.col-card:hover .go{max-height:30px;opacity:1}
@media (hover:none){.col-info .go{max-height:30px;opacity:1}}
.col-big{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col-hero h1{font-family:var(--f-disp);direction:ltr;text-align:right;font-size:clamp(46px,10vw,150px);font-weight:700;line-height:1.05;letter-spacing:.02em}
.col-meta{display:flex;flex-wrap:wrap;gap:20px 50px;margin-top:26px;color:var(--muted);font-size:14px}
.col-meta b{color:var(--cream);font-family:var(--f-disp);letter-spacing:.1em}
.video-box{position:relative;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--line);aspect-ratio:16/9}
.video-box video{width:100%;height:100%;object-fit:contain;background:#000}
.video-box.tall{aspect-ratio:9/16;max-height:80vh;margin-inline:auto}
.video-cap{margin-top:16px}
.video-cap b{display:block;font-size:19px}
.video-cap span{color:var(--muted);font-size:14px}
.col-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.col-gal .card:nth-child(3n+2){margin-top:44px}
.pager{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:60px}
.pager a{padding:34px 0;display:grid;gap:6px;transition:color .3s}
.pager a:hover{color:var(--gold)}
.pager small{color:var(--muted);font-size:12px;letter-spacing:.15em}
.pager b{font-family:var(--f-disp);font-size:clamp(20px,3vw,40px);direction:ltr;text-align:right;font-weight:600;letter-spacing:.05em}
.pager a:last-child{text-align:left;padding-inline-start:30px;border-inline-start:1px solid var(--line)}
.pager a:last-child b{text-align:left}

/* ---------- التعاون ---------- */
.collab-title{font-family:var(--f-disp);direction:ltr;font-size:clamp(36px,8.5vw,130px);line-height:1.1;font-weight:700}
.collab-title .x{color:var(--gold);font-family:var(--f-it);font-style:italic;font-weight:500;padding-inline:.18em}
.collab-vids{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}
.story{display:grid;grid-template-columns:1fr 1.4fr;gap:clamp(30px,6vw,100px);align-items:start}
.story p{color:var(--muted);font-size:clamp(16px,1.4vw,19px);margin-bottom:18px}
.story p b{color:var(--cream)}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.tags span{padding:8px 18px;border:1px solid var(--line2);border-radius:999px;font-size:13px;color:var(--cream)}

/* ---------- الخدمات ---------- */
.svc-list{border-top:1px solid var(--line)}
.svc{position:relative;display:grid;grid-template-columns:70px 1fr 1.2fr 56px;gap:28px;align-items:center;padding:clamp(24px,3.4vw,44px) 10px;border-bottom:1px solid var(--line);overflow:hidden;isolation:isolate;transition:padding .5s var(--ease)}
.svc::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(200,166,106,.12),transparent);transform:scaleX(0);transform-origin:100% 50%;transition:transform .7s var(--ease2);z-index:-1}
.svc:hover::before{transform:scaleX(1)}
.svc:hover{padding-inline:26px}
.svc .n{font-family:var(--f-disp);color:var(--gold);letter-spacing:.2em;font-size:13px;direction:ltr}
.svc h3{font-size:clamp(22px,3vw,40px);font-weight:900;line-height:1.25}
.svc h3 small{display:block;font-family:var(--f-disp);font-size:11px;letter-spacing:.3em;color:var(--muted);font-weight:400;margin-top:4px;direction:ltr;text-align:right}
.svc p{color:var(--muted)}
.svc .ic{width:48px;height:48px;color:var(--gold);transition:transform .8s var(--ease)}
.svc:hover .ic{transform:rotate(90deg) scale(1.15)}
.price{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.price-card{padding:30px 24px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(160deg,rgba(24,20,19,.9),rgba(17,14,13,.7));transition:transform .5s var(--ease),border-color .4s}
.price-card:hover{transform:translateY(-8px);border-color:var(--gold)}
.price-card small{color:var(--muted);font-size:12px;letter-spacing:.1em}
.price-card b{display:block;font-family:var(--f-disp);font-size:clamp(26px,3vw,42px);margin:8px 0 4px;direction:ltr;text-align:right;font-weight:600}
.price-card span{font-size:14px;color:var(--cream)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;counter-reset:s;position:relative}
.step{padding:30px 30px 30px 10px;border-inline-start:1px solid var(--line);padding-inline-start:28px;position:relative}
.step::before{counter-increment:s;content:"0" counter(s);font-family:var(--f-disp);font-size:clamp(40px,5vw,72px);color:transparent;-webkit-text-stroke:1px var(--gold);display:block;line-height:1;margin-bottom:14px}
.step b{font-size:20px;display:block;margin-bottom:6px}
.step p{color:var(--muted);font-size:15px}

/* ---------- الاستوديو ---------- */
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(30px,6vw,100px);align-items:center}
.about-art{position:relative;aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;max-width:480px;width:100%;justify-self:center}
.about-art::before,.about-art::after{content:"";position:absolute;border-radius:50%;border:1px dashed var(--line2);inset:-6%;animation:spin 50s linear infinite}
.about-art::after{inset:10%;animation-direction:reverse;animation-duration:36s;border-color:rgba(200,166,106,.35)}
.about-art img{width:60%;position:relative;z-index:1;animation:float 7s ease-in-out infinite}

.clr{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:-10px 0 26px}
.clr-l{font-size:13px;color:var(--muted);letter-spacing:.04em}
.clr-dots{display:flex;flex-wrap:wrap;gap:10px}
.clr-d{width:28px;height:28px;border-radius:50%;background:var(--c);border:1px solid rgba(233,227,214,.28);position:relative;transition:transform .35s var(--ease),box-shadow .35s}
.clr-d:hover{transform:scale(1.18)}
.clr-d[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--gold);transform:scale(1.12)}
.clr-n{font-size:13px;color:var(--gold)}
.clr-empty{grid-column:1/-1;padding:40px 0;color:var(--muted);text-align:center}

/* ===== العرض الكامل ===== */
.pres-btn{margin-top:20px}
.pres{position:fixed;inset:0;z-index:400;background:#050404;opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s;overflow:hidden;touch-action:pan-y;user-select:none}
.pres.open{opacity:1;visibility:visible;transition:opacity .5s var(--ease)}
.pres-bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(64px) saturate(1.25);opacity:.55;transform:scale(1.1);transition:background-image .8s}
.pres-tint{position:absolute;inset:0;background:radial-gradient(80% 80% at 50% 45%,transparent 25%,rgba(5,4,4,.72)),linear-gradient(var(--pc,#000),var(--pc,#000));background-blend-mode:normal;mix-blend-mode:normal;opacity:1}
.pres-tint::after{content:"";position:absolute;inset:0;background:var(--pc,#000);opacity:.35;mix-blend-mode:color}
.pres-stage{position:absolute;inset:0;display:grid;place-items:center;padding:clamp(56px,8vh,90px) clamp(10px,5vw,80px) clamp(78px,11vh,120px)}
.pres-img{grid-area:1/1;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:6px;box-shadow:0 40px 120px -30px rgba(0,0,0,.85);opacity:0;transform:scale(1.035);transition:opacity .9s var(--ease),transform 1.2s var(--ease)}
.pres-img.on{opacity:1;transform:scale(1)}
.pres-ui{position:absolute;inset:0;pointer-events:none;transition:opacity .5s}
.pres.idle .pres-ui{opacity:0}
.pres.idle{cursor:none}
.pres-x,.pres-ctl button{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:1px solid rgba(200,166,106,.7);background:rgba(10,8,8,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--cream);font-size:18px;display:grid;place-items:center;transition:background .3s,color .3s}
.pres-x:hover,.pres-ctl button:hover{background:var(--cream);color:var(--bg)}
.pres-x{position:absolute;top:max(16px,env(safe-area-inset-top,0px));inset-inline-end:16px}
.pres-cap{position:absolute;inset-inline:0;bottom:max(70px,calc(env(safe-area-inset-bottom,0px) + 62px));text-align:center;text-shadow:0 2px 18px rgba(0,0,0,.8)}
.pres-cap small{display:block;font-family:var(--f-disp);font-size:11px;letter-spacing:.3em;color:var(--gold);direction:ltr}
.pres-cap b{font-size:clamp(16px,2.4vw,22px);font-weight:700}
.pres-ctl{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));inset-inline:0;display:flex;justify-content:center;align-items:center;gap:14px;direction:ltr}
.pres-ctl span{pointer-events:none;min-width:64px;text-align:center;font-family:var(--f-disp);font-size:13px;letter-spacing:.14em;color:var(--cream)}
.pres-bar{position:absolute;inset-inline:0;top:0;height:3px;background:rgba(233,227,214,.12)}
.pres-bar i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left;transform:scaleX(0)}
@keyframes presP{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ===== شريط العرض ===== */
.reel-stage{position:relative;border-radius:calc(var(--r) + 10px);overflow:hidden;border:1px solid var(--line2);height:clamp(520px,74svh,680px);background:#070606;isolation:isolate}
.reel-bg{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(56px) saturate(1.3);opacity:.5;transition:background-image .8s;z-index:-2}
.reel-stage::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(7,6,6,.86),rgba(7,6,6,.35) 60%,rgba(7,6,6,.75))}
.reel-slide{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:clamp(18px,4vw,70px);padding:clamp(26px,5vw,70px);opacity:0;visibility:hidden;transition:opacity .9s var(--ease),visibility 0s .9s;color:inherit}
.reel-slide.on{opacity:1;visibility:visible;transition:opacity .9s var(--ease)}
.reel-txt{display:grid;gap:14px;justify-items:start;z-index:2}
.reel-txt small{font-family:var(--f-disp);font-size:12px;letter-spacing:.3em;color:var(--gold);direction:ltr}
.reel-txt h3{font-family:var(--f-disp);font-size:clamp(34px,5.6vw,76px);font-weight:600;line-height:1.05;direction:ltr;text-align:start;transform:translateY(24px);opacity:0;transition:transform 1s var(--ease) .2s,opacity 1s var(--ease) .2s}
.reel-txt p{color:var(--muted);max-width:44ch;font-size:15px;transform:translateY(18px);opacity:0;transition:transform 1s var(--ease) .35s,opacity 1s var(--ease) .35s}
.reel-txt .btn{transform:translateY(14px);opacity:0;transition:transform 1s var(--ease) .5s,opacity 1s var(--ease) .5s,background .3s,color .3s}
.reel-slide.on h3,.reel-slide.on p,.reel-slide.on .btn{transform:none;opacity:1}
.reel-slide figure{height:100%;max-height:100%;display:grid;place-items:center;overflow:hidden;border-radius:14px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9)}
.reel-slide figure img{width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.reel-slide.on figure img{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.13) translateY(-1.5%)}}
.reel-dots{position:absolute;inset-inline-start:clamp(26px,5vw,70px);bottom:24px;display:flex;gap:8px;z-index:3}
.reel-dots button{width:30px;height:4px;border-radius:2px;background:rgba(233,227,214,.25);transition:background .3s,width .3s}
.reel-dots button[aria-current="true"]{background:var(--gold);width:48px}
.reel-prog{position:absolute;inset-inline:0;bottom:0;height:2px;background:var(--gold);transform-origin:left;transform:scaleX(0);z-index:3;opacity:.7}
html[dir=rtl] .reel-prog{transform-origin:right}
@keyframes reelp{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:760px){

}

<script>
/* ============================================================
   O.Arabi — الصوت الخلفي (ما تيسر من سورة العنكبوت)
   - شاشة اختيار عند الدخول (المتصفحات بتمنع التشغيل التلقائي من غير ضغطة)
   - زرار ثابت للتحكم + مستوى الصوت، واختيارك بيتحفظ
   - بيقف لوحده لما تفتح تاب تاني، أو تشغّل فيديو في الموقع
   ============================================================ */
(() => {
'use strict';
const SRC = window.__AUDIO || 'audio/ankabut.m4a';
const KEY = 'oa-sound', VKEY = 'oa-vol';
const st = { get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };
const a = new Audio(); a.loop = true; a.preload = 'auto'; a.src = SRC; a.volume = 0;
let want = false, raf = 0, resumeVideo = false, armed = false;
let vol = Math.min(1, Math.max(0, parseFloat(st.get(VKEY)) || .4));

const fade = (to, ms, done) => {
  cancelAnimationFrame(raf);
  const from = a.volume, t0 = performance.now();
  (function s(n) {
    const p = Math.min(1, (n - t0) / ms);
    a.volume = Math.min(1, Math.max(0, from + (to - from) * p));
    p < 1 ? (raf = requestAnimationFrame(s)) : (done && done());
  })(t0);
};

/* زرار التحكم */
const box = document.createElement('div');
box.className = 'snd';
box.innerHTML = `<button type="button" class="snd-btn" aria-pressed="false" aria-label="تشغيل الصوت"><svg class="snd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button><label class="snd-vol"><span class="sr">مستوى الصوت</span><input type="range" min="0" max="100" value="${Math.round(vol * 100)}"></label>`;
document.body.appendChild(box);
const btn = box.querySelector('.snd-btn'), rng = box.querySelector('input');
const ui = () => {
  box.classList.toggle('on', want);
  btn.setAttribute('aria-pressed', want);
  btn.setAttribute('aria-label', want ? 'إيقاف الصوت' : 'تشغيل الصوت');
  btn.title = 'ما تيسر من سورة العنكبوت';
};
function play() {
  want = true; st.set(KEY, 'on'); ui();
  const p = a.play();
  if (p && p.catch) p.catch(() => { want = false; ui(); arm(); });
  fade(vol, 1800);
}
function stop(save) {
  want = false; if (save) st.set(KEY, 'off'); ui();
  fade(0, 600, () => { if (!want) a.pause(); });
}
btn.addEventListener('click', () => (want ? stop(true) : play()));
rng.addEventListener('input', () => {
  vol = rng.value / 100; st.set(VKEY, vol);
  if (want && !resumeVideo) { cancelAnimationFrame(raf); a.volume = vol; }
});

/* لو اخترت الصوت قبل كده: يشتغل مع أول لمسة */
function arm() {
  if (armed) return; armed = true;
  const evs = ['pointerup', 'keydown', 'touchend'];
  const go = e => {
    if (e.target.closest && e.target.closest('.snd')) return;
    evs.forEach(n => removeEventListener(n, go, true)); armed = false;
    if (st.get(KEY) === 'on') play();
  };
  evs.forEach(n => addEventListener(n, go, true));
}

/* بيقف مع التاب المخفي ومع الفيديوهات */
document.addEventListener('visibilitychange', () => {
  if (!want) return;
  if (document.hidden) a.pause(); else if (!resumeVideo) a.play().catch(() => {});
});
document.addEventListener('play', e => {
  if (e.target.tagName === 'VIDEO' && want) { resumeVideo = true; fade(0, 400, () => a.pause()); }
}, true);
const back = e => {
  if (e.target.tagName !== 'VIDEO' || !resumeVideo) return;
  resumeVideo = false;
  if (want) { a.play().catch(() => {}); fade(vol, 1200); }
};
document.addEventListener('pause', back, true);
document.addEventListener('ended', back, true);

if ('mediaSession' in navigator) {
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'ما تيسر من سورة العنكبوت', artist: 'O. Arabi' });
    navigator.mediaSession.setActionHandler('play', () => play());
    navigator.mediaSession.setActionHandler('pause', () => stop(true));
  } catch (_) {}
}

/* شاشة الدخول: بتتنادى من app.js قبل ما الـ preloader يفتح */
const h = new Date().getHours();
const greet = h < 12 ? 'صباح الخير' : h >= 17 ? 'مساء الخير' : 'أهلاً بيك';
window.OA_GATE = () => new Promise(res => {
  const s = st.get(KEY);
  if (s === 'off') return res();
  if (s === 'on') { arm(); return res(); }
  const g = document.createElement('div');
  g.className = 'gate';
  g.innerHTML = `<p>${greet}</p><small>ما تيسر من سورة العنكبوت بصوت هادي في الخلفية، وتقدر توقفه في أي وقت.</small><div class="gate-btns"><button type="button" class="btn btn-gold" data-s="1">ادخل بالصوت</button><button type="button" class="btn" data-s="0">ادخل بدون صوت</button></div>`;
  (document.querySelector('.loader-in') || document.body).appendChild(g);
  requestAnimationFrame(() => requestAnimationFrame(() => g.classList.add('show')));
  g.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.s === '1') play(); else st.set(KEY, 'off');
    g.classList.remove('show'); setTimeout(res, 260);
  }, { once: true });
});
ui();
})();

const blobCache = {};
function blobUrl(f) {
  if (blobCache[f]) return blobCache[f];
  const bin = atob(EMBED[f]), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return (blobCache[f] = URL.createObjectURL(new Blob([u], { type: MIME[LOCAL[f].split('.').pop()] || 'image/webp' })));
}
/* ملف محلي (فولدر img أو مدمج) أو من الموقع القديم */
const src = f => {
  if (/^https?:|^\//.test(f)) return f;
  if (LOCAL[f]) return (EMBED && EMBED[f]) ? blobUrl(f) : (window.LOCAL_DIR || 'img/') + LOCAL[f];
  return BASE + f;
};

  const st = d ? ` style="aspect-ratio:${d[0]}/${d[1]};min-height:0"` : '';

  return `<div class="ph"${st}><img loading="lazy" decoding="async" ${wh}src="${src(file)}" alt="${alt}" onload="this.classList.add('ld');this.parentNode.classList.add('ok')" onerror="this.parentNode.classList.add('err')"></div>`;
};

function bindTilt(root) {
  $$('[data-tilt]', root).forEach(el => {
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      el.style.transform = `perspective(900px) rotateY(${x * -9}deg) rotateX(${y * 9}deg) translateY(-4px)`;
    });
    el.addEventListener('pointerleave', () => { el.style.transform = ''; });
  });
}

let cleanups = [];
let ready = false; const readyQ = [];
const onReady = fn => ready ? fn() : readyQ.push(fn);

function parse() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('?')[0].replace(/\/$/, '');
  const [a, b] = h.split('/');
  if (a === 'work' && b) {
    if (D.works.some(w => w.file === b)) return { key: 'works', sub: '', deep: b };
    const c = D.collections.find(c => c.items.some(it => it.file === b));
    if (c) return { key: 'collections', sub: c.id, deep: b };
  }
  return { key: a || '', sub: b || '' };
}

function render() {
  cleanups.forEach(f => f()); cleanups = [];
  const { key, sub, deep } = parse();
  let html = null, navKey = key;
  if (key === '') html = home();
  else if (key === 'works') html = worksPage();
  else if (key === 'collections') html = sub ? collectionPage(sub) : collectionsPage();
  else if (key === 'collab') html = collabPage();
  else if (key === 'services') html = servicesPage();
  else if (key === 'studio') html = studioPage();
  else if (key === 'contact') html = contactPage();
  if (html === null) { html = home(); navKey = ''; }
  view.innerHTML = html;
  document.title = (key === 'collections' && sub)
    ? `${(D.collections.find(c => c.id === sub) || {}).name || 'المجموعات'} — O. Arabi`
    : (TITLES[navKey] || TITLES['']);
  setActive(navKey);
  setFab(navKey, parse().sub);
  setup(navKey);

}
/* فتح تصميم معيّن من رابط مشاركة (#/work/اسم-الملف) */
function openDeep(file) {
  let i = lbList.findIndex(x => x.file === file);
  if (i < 0) {
    const w = D.works.find(x => x.file === file); let it = w ? { file: w.file, t: w.t, s: w.tag } : null;
    if (!it) for (const c of D.collections) { const f = c.items.find(x => x.file === file); if (f) { it = { file: f.file, t: f.t, s: f.s }; break; } }
    if (!it) return;
    lbList = [it]; i = 0;
  }
  setTimeout(() => lbOpen(i), 450);
}

let navigating = false, queued = false;
const curtain = $('#curtain');
async function curtainIn() { curtain.classList.remove('out'); curtain.classList.add('in'); await sleep(780); }
async function curtainOut() { curtain.classList.remove('in'); curtain.classList.add('out'); await sleep(820); curtain.classList.remove('out'); }

async function route(first) {
  if (navigating) { queued = true; return; }
  navigating = true;
  closeMenu();
  const anim = !first && !reduce;
  if (anim) await curtainIn();
  render();
  window.scrollTo(0, 0);
  if (anim) { await sleep(80); await curtainOut(); }
  navigating = false;
  if (queued) { queued = false; route(); }
}
window.addEventListener('hashchange', () => route(false));

/* ---------------- Setup بعد كل رندر ---------------- */
function splitWords(el) {
  let i = 0;
  const walk = node => {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(p => {
          if (!p) return;
          if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(' ')); return; }
          const w = document.createElement('span'); w.className = 'w';
          const s = document.createElement('span'); s.style.setProperty('--i', i++); s.textContent = p;
          w.appendChild(s); frag.appendChild(w);
        });
        n.replaceWith(frag);
      } else if (n.nodeType === 1 && n.tagName !== 'BR') walk(n);
    });
  };
  walk(el);
}

const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const t = e.target;
  t.classList.add('in');
  if (t.dataset.count) countUp(t);
  io.unobserve(t);
}), { threshold: .12, rootMargin: '0px 0px -6% 0px' });

function countUp(el) {
  const end = +el.dataset.count; const dur = 1800; const t0 = performance.now();
  const plus = end >= 10 ? '+' : '';
  const tick = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 4);
    el.textContent = plus + Math.round(end * e);
    if (p < 1) requestAnimationFrame(tick);
  };
  reduce ? (el.textContent = plus + end) : requestAnimationFrame(tick);
}

function setup(key) {
  $$('.split', view).forEach(splitWords);
  onReady(() => {
    $$('[data-reveal],.split,[data-count]', view).forEach(el => io.observe(el));
  });

  /* Hero parallax */
  const art = $('#heroArt');
  if (art && fine) {
    const mv = e => {
      art.style.setProperty('--mx', ((e.clientX / innerWidth) - .5) * 2);
      art.style.setProperty('--my', ((e.clientY / innerHeight) - .5) * 2);
    };
    window.addEventListener('pointermove', mv);
    cleanups.push(() => window.removeEventListener('pointermove', mv));
  }

  /* Rail drag */
  const rail = $('#rail');
  if (rail) dragScroll(rail);

  /* Works grid + filters */
  if (key === 'works') {
    renderGrid('all');
    $('#filters').addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      $$('.chip', view).forEach(c => c.classList.toggle('active', c === b));
      renderGrid(b.dataset.cat);
    });
  }

  /* Collections filter */
  if (key === 'collections' && !parse().sub) {
    renderCols('all', true);
    $('#colFilters').addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      $$('.chip', view).forEach(c => c.classList.toggle('active', c === b));
      renderCols(b.dataset.g);
    });
  }

  /* Tilt + magnetic */
  if (fine && !reduce) {
    $$('[data-tilt]', view).forEach(el => {
      el.addEventListener('pointermove', e => {
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        el.style.transform = `perspective(900px) rotateY(${x * -9}deg) rotateX(${y * 9}deg) translateY(-4px)`;
      });
      el.addEventListener('pointerleave', () => { el.style.transform = ''; });
    });
    $$('[data-magnet]', view).concat($$('[data-magnet]', $('#nav'))).forEach(el => {
      el.addEventListener('pointermove', e => {
        const r = el.getBoundingClientRect();
        el.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .25}px,${(e.clientY - r.top - r.height / 2) * .35}px)`;
      });
      el.addEventListener('pointerleave', () => { el.style.transform = ''; });
    });
  }

  /* FAQ */
  $$('.q button', view).forEach(b => b.addEventListener('click', () => {
    const q = b.parentNode, open = !q.classList.contains('open');
    $$('.q', view).forEach(x => { x.classList.remove('open'); $('button', x).setAttribute('aria-expanded', 'false'); });
    if (open) { q.classList.add('open'); b.setAttribute('aria-expanded', 'true'); }
  }));

  /* Reviews */
  const rev = $('#rev');
  if (rev) {
    const cards = $$('.rev-card', rev), dots = $$('#dots button');
    let i = 0, timer;
    const show = n => {
      cards[i].classList.remove('on'); cards[i].classList.add('off');
      const old = cards[i];
      setTimeout(() => old.classList.remove('off'), 900);

function dragScroll(el) {
  let down = false, sx = 0, sl = 0, moved = false;
  el.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') return; down = true; moved = false; sx = e.clientX; sl = el.scrollLeft; });
  window.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 5) { moved = true; el.classList.add('drag'); }
    el.scrollLeft = sl - dx;
  });
  window.addEventListener('pointerup', () => { down = false; el.classList.remove('drag'); });
  el.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
}

(function stars() {
  const c = $('#stars'), g = c.getContext('2d');
  let W, H, S = [], shoot = null, mx = 0, my = 0, nextShoot = 3000;
  const gold = '200,166,106', cream = '233,227,214';
  function size() {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = c.width = innerWidth * d; H = c.height = innerHeight * d;
    const n = Math.min(150, Math.round(innerWidth * innerHeight / 9500));
    S = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.2 + .3) * d,
      p: Math.random() * 6.28, s: Math.random() * .8 + .3, z: Math.random(), g: Math.random() < .22, big: Math.random() < .06
    }));
    if (reduce) draw(0);
  }
  window.addEventListener('pointermove', e => { mx = (e.clientX / innerWidth - .5); my = (e.clientY / innerHeight - .5); });
  function draw(t) {
    g.clearRect(0, 0, W, H);
    for (const s of S) {
      const a = .25 + .55 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
      const ox = mx * s.z * 26 * (W / innerWidth), oy = my * s.z * 26 * (W / innerWidth);
      const col = s.g ? gold : cream;
      g.fillStyle = `rgba(${col},${a})`;
      g.beginPath(); g.arc(s.x + ox, s.y + oy, s.r, 0, 6.283); g.fill();
      if (s.big) {
        g.strokeStyle = `rgba(${col},${a * .8})`; g.lineWidth = 1;
        const l = s.r * 5;
        g.beginPath(); g.moveTo(s.x + ox - l, s.y + oy); g.lineTo(s.x + ox + l, s.y + oy);
        g.moveTo(s.x + ox, s.y + oy - l); g.lineTo(s.x + ox, s.y + oy + l); g.stroke();
      }
    }
    if (!reduce) {
      if (!shoot && t > nextShoot) {
        const d = W / innerWidth;
        shoot = { x: Math.random() * W * .8 + W * .2, y: Math.random() * H * .4, vx: -(8 + Math.random() * 6) * d, vy: (4 + Math.random() * 3) * d, life: 0 };
      }
      if (shoot) {
        shoot.x += shoot.vx; shoot.y += shoot.vy; shoot.life++;
        const gr = g.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * 9, shoot.y - shoot.vy * 9);
        gr.addColorStop(0, `rgba(${gold},.9)`); gr.addColorStop(1, `rgba(${gold},0)`);
        g.strokeStyle = gr; g.lineWidth = 1.6; g.beginPath(); g.moveTo(shoot.x, shoot.y); g.lineTo(shoot.x - shoot.vx * 9, shoot.y - shoot.vy * 9); g.stroke();
        if (shoot.life > 70) { shoot = null; nextShoot = t + 5000 + Math.random() * 7000; }
      }
    }
  }
  function loop(t) { draw(t); requestAnimationFrame(loop); }
  size(); window.addEventListener('resize', size);
  if (!reduce) requestAnimationFrame(loop);
})();

fvx.addEventListener('click', e => {
  if (e.target === fvx || e.target.closest('[data-x]')) return fvx.classList.remove('show');
  if (e.target.closest('[data-clear]')) { favSave([]); return favPaint(); }
  const rm = e.target.closest('[data-rm]');
  if (rm) { const a = favs(); a.splice(+rm.dataset.rm, 1); favSave(a); return favPaint(); }
  const it = e.target.closest('.fvx-it');
  if (it) { const a = favs(); fvx.classList.remove('show'); window.OA_open(a.map(x => ({ file: x.file, t: x.t, s: x.s })), +it.dataset.i); }
});
addEventListener('keydown', e => { if (e.key === 'Escape' && fvx.classList.contains('show')) { e.stopPropagation(); fvx.classList.remove('show'); } }, true);
favPaint();

const sync = () => {
  img.classList.remove('zoomed'); fig.classList.remove('zoomed');
  paint(); pull();
  order.href = wa(M(`أهلاً O.Arabi 👋 عجبني تصميم "${lt.textContent}${ls.textContent ? ' — ' + ls.textContent : ''}" وعايز أطلب تصميم زيه.`, `Hi O.Arabi 👋 I liked the design "${lt.textContent}${ls.textContent ? ' — ' + ls.textContent : ''}" and I’d like to order one like it.`));
};
new MutationObserver(sync).observe(fig.querySelector('figcaption'), { childList: true, subtree: true, characterData: true });
const origin = e => {
  const r = img.getBoundingClientRect();
  img.style.transformOrigin = `${(e.clientX - r.left) / r.width * 100}% ${(e.clientY - r.top) / r.height * 100}%`;
};
img.addEventListener('click', e => {
  const z = img.classList.toggle('zoomed'); fig.classList.toggle('zoomed', z);
  if (z) origin(e);
});
img.addEventListener('pointermove', e => { if (img.classList.contains('zoomed')) origin(e); });

/* 3) كل حملة بتلوّن صفحتها بألوانها */
const lum = h => { const n = parseInt(h.slice(1), 16); return (.2126 * (n >> 16) + .7152 * ((n >> 8) & 255) + .0722 * (n & 255)) / 255; };
const root = document.documentElement;

/* 4) حاسبة التكلفة في صفحة الخدمات */
function calc(price) {
  const pk = id => D.packages.find(k => k.id === id);
  const rng = id => { const n = ((pk(id) || {}).price || '').match(/\d+/g); return n ? [+n[0], +n[n.length - 1]] : [0, 0]; };
  let k = 'poster', q = 1;
  const sec = document.createElement('section');
  sec.id = 'calc'; sec.className = 'sec calc';
  sec.innerHTML = `
    <div class="sec-head"><div><div class="eyebrow">Estimate</div><h2 class="h2" style="margin-top:14px">احسب تكلفة مشروعك</h2></div></div>
    <div class="calc-box">
      <div class="calc-row"><span>نوع التصميم</span><div class="filters">${['poster', 'vip'].map((id, i) => `<button type="button" class="chip${i ? '' : ' active'}" data-k="${id}">${pk(id).t}</button>`).join('')}</div></div>
      <div class="calc-row"><span>عدد التصاميم</span><div class="qty"><button type="button" data-q="-1" aria-label="أقل">−</button><b id="cq">1</b><button type="button" data-q="1" aria-label="أكتر">+</button></div></div>
      <div class="calc-out"><small>التكلفة التقريبية</small><b id="cp"></b><span>جنيه مصري</span></div>
      <button type="button" class="btn btn-gold" id="cgo">ابعت الحساب على واتساب <span class="arr">←</span></button>
    </div>`;
  price.closest('section').after(sec);
  const total = () => { const [lo, hi] = rng(k); return lo === hi ? `${lo * q}` : `${lo * q}–${hi * q}`; };
  const upd = () => { $('#cq').textContent = q; $('#cp').textContent = total(); };
  sec.addEventListener('click', e => {
    const c = e.target.closest('[data-k]'), s = e.target.closest('[data-q]');
    if (c) { k = c.dataset.k; sec.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x === c)); upd(); }
    if (s) { q = Math.min(50, Math.max(1, q + +s.dataset.q)); upd(); }
    if (e.target.closest('#cgo')) window.open(wa(M(`أهلاً O.Arabi 👋 عايز ${q} ${pk(k).t}، والتكلفة التقريبية ${total()} جنيه.`, `Hi O.Arabi 👋 I’d like ${q} × ${T(pk(k).t)} — the estimated cost is EGP ${total()}.`)), '_blank', 'noopener');
  });
  upd();
}

function enhance() {
  const m = location.hash.match(/#\/collections\/([^/?]+)/);
  const c = m && D.collections.find(x => x.id === decodeURIComponent(m[1]));
  const pal = c && c.story && c.story.palette;
  if (pal && pal.length && $('.col-hero')) {
    root.style.setProperty('--gold', [...pal].sort((a, b) => lum(b) - lum(a))[0]);
    root.style.setProperty('--camp', pal[Math.floor(pal.length / 2)]);
    document.body.classList.add('camp');
  } else {
    root.style.removeProperty('--gold'); root.style.removeProperty('--camp');
    document.body.classList.remove('camp');
  }
  const price = $('.price');
  if (price && !$('#calc')) calc(price);
}
new MutationObserver(enhance).observe($('#view'), { childList: true });
enhance();
})();
</script>

<script>
/* ============================================================
   O.Arabi — البحث في الموقع (مجموعات + تصاميم)
   ============================================================ */
(() => {
'use strict';
const D = window.OA, $ = (s, r = document) => r.querySelector(s);
const norm = s => String(s || '').toLowerCase().replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const colOf = {};
D.collections.forEach(c => c.items.forEach(it => { colOf[it.file] = c; }));
const seen = new Set(), items = [];
const add = (it, extra) => { if (!it.file || seen.has(it.file)) return; seen.add(it.file); const c = colOf[it.file]; items.push({ it, hay: norm([it.t, it.s, extra, c && c.name, c && c.client].join(' ')) }); };
D.works.forEach(w => add({ file: w.file, t: w.t, s: w.tag }, w.cat));
D.collections.forEach(c => c.items.forEach(it => add({ file: it.file, t: it.t, s: it.s }, '')));
const cols = D.collections.map(c => ({ c, hay: norm([c.name, c.client, c.badge, c.blurb, c.id, (c.story && c.story.words || []).join(' ')].join(' ')) }));
const cover = c => c.cover || (c.items.find(i => !i.overview) || c.items[0]).file;

const box = document.createElement('div');
box.className = 'srch'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'بحث');
box.innerHTML = '<div class="srch-in"><div class="srch-bar"><input type="search" placeholder="ابحث عن حملة أو تصميم…" autocomplete="off" enterkeyhint="search"><button type="button" class="srch-x" aria-label="إغلاق">✕</button></div><div class="srch-out"></div></div>';
document.body.appendChild(box);
const inp = $('input', box), out = $('.srch-out', box);
let results = [];
const colRow = c => `<a class="srch-col" href="#/collections/${esc(c.id)}"><img src="${esc(window.OA_src(cover(c)))}" alt="" loading="lazy"><span><b>${esc(c.name)}</b><small>${esc(c.client || c.badge || '')}</small></span></a>`;
function draw() {
  const q = norm(inp.value).trim(), terms = q.split(/\s+/).filter(Boolean);
  const cm = terms.length ? cols.filter(x => terms.every(t => x.hay.includes(t))).map(x => x.c) : D.collections;
  results = terms.length ? items.filter(x => terms.every(t => x.hay.includes(t))).slice(0, 36).map(x => x.it) : [];
  let h = '';
  if (cm.length) h += `<h4>${terms.length ? 'المجموعات' : 'تصفّح المجموعات'}</h4><div class="srch-cols">${cm.slice(0, terms.length ? 8 : 40).map(colRow).join('')}</div>`;
  if (results.length) h += `<h4>التصاميم (${results.length})</h4><div class="srch-grid">${results.map((it, i) => `<button type="button" class="srch-it" data-i="${i}"><img src="${esc(window.OA_src(it.file))}" alt="${esc(it.t)}" loading="lazy"><span>${esc(it.t)}</span></button>`).join('')}</div>`;
  if (terms.length && !cm.length && !results.length) h = '<p class="srch-empty">مفيش نتائج. جرّب كلمة تانية.</p>';
  out.innerHTML = h;
}
const open = () => { box.classList.add('show'); document.body.style.overflow = 'hidden'; inp.value = ''; draw(); setTimeout(() => inp.focus(), 30); };
const close = () => { box.classList.remove('show'); if (!$('#lb').classList.contains('open')) document.body.style.overflow = ''; inp.blur(); };
$('#navSearch').addEventListener('click', open);
$('.srch-x', box).addEventListener('click', close);
box.addEventListener('click', e => { if (e.target === box) close(); });
inp.addEventListener('input', draw);
out.addEventListener('click', e => {
  if (e.target.closest('.srch-col')) return close();
  const b = e.target.closest('.srch-it'); if (!b) return;
  const list = results.slice(), i = +b.dataset.i;
  close(); window.OA_open(list, i);
});
addEventListener('keydown', e => {
  if (e.key === 'Escape' && box.classList.contains('show')) { e.stopPropagation(); close(); return; }
  const t = e.target, typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
  if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') || (e.key === '/' && !typing)) { e.preventDefault(); open(); }
}, true);
})();
</script>

<script>
/* ============================================================
   O.Arabi — تأثير الضغط: موجة ذهبية + صوت خفيف مع كل ضغطة
   ============================================================ */
(() => {
'use strict';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const on = () => { try { return localStorage.getItem('oa-sound') !== 'off'; } catch (_) { return true; } };
let ac = null, out = null, last = 0;
function audio() {
  if (!ac) {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    ac = new C(); out = ac.createGain(); out.gain.value = .55;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
    out.connect(lp); lp.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f0, f1, at, dur, vol, type) {
  const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * .8);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .03);
}
function sfx(strong, p = 1) {
  if (!on() || !audio()) return;
  const j = p * (1 + (Math.random() - .5) * .05);
  if (strong) { tone(784 * j, 880 * j, 0, .16, .07, 'sine'); tone(1175 * j, 1245 * j, .06, .22, .05, 'sine'); tone(2349 * j, 2349 * j, .06, .12, .012, 'triangle'); }
  else tone(620 * j, 900 * j, 0, .09, .045, 'sine');
}
const layer = document.createElement('div'); layer.className = 'fx'; layer.setAttribute('aria-hidden', 'true'); document.body.appendChild(layer);
const COLORS = ['#c8a66a', '#e9e3d6', '#f0d9a0'];
const EASE = 'cubic-bezier(.22,1,.36,1)';
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const el = css => { const n = document.createElement('i'); n.style.cssText = css; layer.appendChild(n); return n; };
const go = (n, kf, dur, delay) => { const a = n.animate(kf, { duration: dur, easing: EASE, fill: 'forwards', delay: delay || 0 }); a.onfinish = () => n.remove(); };
const box = (x, y, w, h) => `left:${x - w / 2}px;top:${y - h / 2}px;width:${w}px;height:${h}px;`;
const STAR = 'polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)';
const FX = [
  /* حلقات دهبية رفيعة متتالية */
  (x, y) => { for (let n = 0; n < 2; n++) go(el(box(x, y, 96, 96) + 'border:1px solid #c8a66a;opacity:0'), [{ transform: 'scale(.15)', opacity: .95 }, { transform: 'scale(1)', opacity: 0 }], 820, n * 150); },
  /* شرارات صغيرة ناعمة */
  (x, y) => { for (let n = 0; n < 8; n++) { const a = Math.PI * 2 * (n / 8) + rnd(0, .4), d = rnd(30, 62), c = pick(COLORS); go(el(box(x, y, 3, 3) + `background:${c};box-shadow:0 0 6px ${c}`), [{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(.3)`, opacity: 0 }], rnd(560, 760)); } },
  /* نجوم بأربع أطراف (نفس نجمة الموقع) */
  (x, y) => { for (let n = 0; n < 4; n++) { const a = Math.PI * 2 * (n / 4) + .6 + rnd(0, .4), d = rnd(34, 62), sz = rnd(11, 19), c = pick(COLORS); go(el(box(x, y, sz, sz) + `background:${c};clip-path:${STAR};border-radius:0`), [{ transform: 'translate(0,0) scale(.3)', opacity: 0 }, { transform: `translate(${Math.cos(a) * d * .7}px,${Math.sin(a) * d * .7}px) scale(1)`, opacity: 1, offset: .35 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(.4)`, opacity: 0 }], rnd(700, 900)); } },
  /* أشعة رفيعة */
  (x, y) => { for (let n = 0; n < 10; n++) { const a = n * 36; go(el(box(x, y, 1, 18) + 'background:linear-gradient(#c8a66a,rgba(200,166,106,0));border-radius:0'), [{ transform: `rotate(${a}deg) translateY(-14px) scaleY(.2)`, opacity: 1 }, { transform: `rotate(${a}deg) translateY(-46px) scaleY(1)`, opacity: .9, offset: .5 }, { transform: `rotate(${a}deg) translateY(-66px) scaleY(.2)`, opacity: 0 }], 640); } },
  /* معينات مفرغة رفيعة */
  (x, y) => { for (let n = 0; n < 5; n++) { const a = Math.PI * 2 * (n / 5) + rnd(0, .5), d = rnd(36, 66), c = pick(COLORS); go(el(box(x, y, 10, 10) + `border:1px solid ${c};border-radius:0`), [{ transform: 'translate(0,0) rotate(45deg) scale(.4)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) rotate(45deg) scale(1.2)`, opacity: 0 }], rnd(640, 820)); } },
  /* توهج دافئ + حلقة */
  (x, y) => { go(el(box(x, y, 170, 170) + 'background:radial-gradient(circle,rgba(200,166,106,.42),rgba(200,166,106,0) 66%)'), [{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(.85)', opacity: 1, offset: .3 }, { transform: 'scale(1.25)', opacity: 0 }], 800); go(el(box(x, y, 30, 30) + 'border:1px solid #f0d9a0'), [{ transform: 'scale(.3)', opacity: 1 }, { transform: 'scale(1.7)', opacity: 0 }], 560); },
  /* وميض عدسة: خطين متقاطعين */
  (x, y) => { go(el(box(x, y, 130, 1) + 'background:linear-gradient(90deg,rgba(240,217,160,0),#f0d9a0,rgba(240,217,160,0));border-radius:0'), [{ transform: 'scaleX(.1)', opacity: 0 }, { transform: 'scaleX(1)', opacity: 1, offset: .35 }, { transform: 'scaleX(1.15)', opacity: 0 }], 700); go(el(box(x, y, 1, 130) + 'background:linear-gradient(180deg,rgba(240,217,160,0),#f0d9a0,rgba(240,217,160,0));border-radius:0'), [{ transform: 'scaleY(.1)', opacity: 0 }, { transform: 'scaleY(1)', opacity: 1, offset: .35 }, { transform: 'scaleY(1.15)', opacity: 0 }], 700); go(el(box(x, y, 6, 6) + 'background:#fff6dc;box-shadow:0 0 12px #f0d9a0'), [{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1)', opacity: 1, offset: .3 }, { transform: 'scale(.2)', opacity: 0 }], 600); }
];
const HITS = [
  [[{ scale: '1' }, { scale: '.96' }, { scale: '1' }], 280],
  [[{ translate: '0 0' }, { translate: '0 -3px' }, { translate: '0 0' }], 300],
  [[{ filter: 'brightness(1)' }, { filter: 'brightness(1.18)' }, { filter: 'brightness(1)' }], 340]
];
/* شنطة عشوائية: كل الأشكال بتتعرض مرة قبل ما أي شكل يتكرر، ومفيش شكل بيتكرر ورا بعضه */
const bag = (n) => { let b = [], lastI = -1; return () => { if (!b.length) { b = Array.from({ length: n }, (_, i) => i).sort(() => Math.random() - .5); if (b[b.length - 1] === lastI) b.unshift(b.pop()); } return (lastI = b.pop()); }; };
const nextFx = bag(FX.length), nextHit = bag(HITS.length);
addEventListener('click', e => {
  const now = performance.now(); if (now - last < 45) return; last = now;
  const t = e.target.closest ? e.target : null; if (!t) return;
  if (t.closest('input[type=text],input[type=search],input[type=range],textarea,select')) return;
  const hit = t.closest('a,button,[role=button],summary,label,.chip,.card,.price-card,.ch2,.tile');
  let x = e.clientX, y = e.clientY;
  if (!e.detail || (!x && !y)) { const r = (hit || t).getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
  const i = reduce ? 0 : nextFx();
  sfx(!!hit, .92 + i * .035);
  if (reduce) return;
  FX[i](x, y);
  if (hit && hit.animate) { const r = hit.getBoundingClientRect(); if (r.width < 560 && r.height < 460) { const h = HITS[nextHit()]; try { hit.animate(h[0], { duration: h[1], easing: 'ease-out' }); } catch (_) {} } }
}, true);
})();
</script>
